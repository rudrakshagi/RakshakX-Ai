<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <div class="brand">
                    <div class="logo-dot pulse"></div>
                    <h1>OpenCode Chat</h1>
                </div>
                
                <div class="controls">
                    <div class="control-group">
                        <label for="model-select">Model</label>
                        <select id="model-select" class="glass-select" disabled>
                            <option>Loading models...</option>
                        </select>
                    </div>
                    
                    <div class="control-group toggle-group">
                        <span class="toggle-label">Stream</span>
                        <label class="switch">
                            <input type="checkbox" id="stream-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </div>
        </header>

        <div id="error-container" class="error-container hidden">
            <div class="error-box">
                <span id="error-message" class="error-message"></span>
                <button id="dismiss-error" class="dismiss-btn">&times;</button>
            </div>
        </div>

        <main id="chat-container" class="chat-container">
            <div class="messages" id="messages">
                <div class="message assistant welcome-message">
                    <div class="message-content">
                        Hello! I'm OpenCode Assistant. Select a model and ask me anything.
                    </div>
                </div>
            </div>
            
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>

        <footer class="input-area glass-footer">
            <div class="input-wrapper">
                <textarea 
                    id="message-input" 
                    placeholder="Type a message... (Shift+Enter for new line)"
                    rows="1"
                    disabled
                ></textarea>
                <button id="send-button" class="send-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
