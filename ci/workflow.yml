name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_VERSION: "0.5"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (uv)
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check rakshak/ tests/

      - name: Type checking with Mypy
        run: uv run mypy rakshak/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv)
        run: uv sync --extra dev

      - name: Run unit tests with coverage
        run: uv run pytest tests/ -m "not docker and not e2e and not live" --cov=rakshak --cov-report=term-missing --cov-fail-under=30

  docker-and-e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (uv)
        run: uv sync --extra dev

      - name: Build sandbox image
        run: docker build -t rakshakx/sandbox:latest -f containers/Dockerfile .
        timeout-minutes: 20

      - name: Run Docker integration tests
        run: uv run pytest tests/docker -m "docker or not docker" -v

      - name: Run E2E tests (mocked, no tokens)
        run: uv run pytest tests/e2e --ignore=tests/e2e/test_live_target.py -v

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (uv)
        run: uv sync --extra dev

      - name: Benchmark freeze-only smoke
        run: uv run python scripts/run_benchmark_v2.py --freeze-only --output-dir /tmp/bench-smoke && test -f /tmp/bench-smoke/environment_freeze.json && python -c "import json; d=json.load(open('/tmp/bench-smoke/environment_freeze.json')); assert 'integrity_hash' in d, 'missing hash'; assert d['hardware']['cpu_model']"

      - name: Benchmark adapters smoke
        run: uv run pytest tests/test_benchmark_v2.py tests/test_benchmark_adapters.py -v
